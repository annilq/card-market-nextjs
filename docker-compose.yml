services:
  app:
    build: .
    ports:
      - '3100:3100'
    environment:
      DATABASE_URI: postgres://postgres:postgres@database:5432/card_market_payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-in-production}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
      # 上传：留空走本地卷；填了就走 S3 兼容对象存储（R2 / S3 / Spaces）
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_KEY: ${S3_KEY:-}
      S3_SECRET: ${S3_SECRET:-}
    volumes:
      - media:/app/media
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: card_market_payload
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- 监控 ----
  # 实时查看容器日志（只读 docker.sock，零代码改动）
  logs:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - app

  # 存活 / 端口 / SSL 监控 + 告警（Telegram / Discord / 邮件）
  uptime:
    image: louislam/uptime-kuma:latest
    volumes:
      - uptime-kuma:/app/data
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      - app

volumes:
  pgdata:
  media:
  uptime-kuma:
