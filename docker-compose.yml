services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-zh}
    ports:
      - '3100:3100'
    env_file:
      - .env
    environment:
      PORT: '3100'
      HOSTNAME: '0.0.0.0'
    volumes:
      - media:/app/media
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require("http").get("http://127.0.0.1:3100/api/health",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2G

  # 实时查看容器日志（只读 docker.sock，零代码改动）
  logs:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:8080:8080'
    restart: unless-stopped
    depends_on:
      - app

  # 存活 / 端口 / SSL 监控 + 告警（Telegram / Discord / 邮件）
  uptime:
    image: louislam/uptime-kuma:latest
    volumes:
      - uptime-kuma:/app/data
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped
    depends_on:
      - app

volumes:
  media:
  uptime-kuma:
